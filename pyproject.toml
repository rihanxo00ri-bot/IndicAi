[project]
name = "indicai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rihanxo00ri-bot", email = "rihan.xo00ri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
indicai = "indicai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
